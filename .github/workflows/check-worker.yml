# Checks that the request-form service is up and can reach SharePoint. Run it from the Actions tab.
name: Check request form service
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Run checks
        run: |
          API="https://mta-requests.midamericameter.workers.dev"
          ok=1
          echo "1) Service is up:"
          h=$(curl -sS -m 20 "$API/health"); echo "   $h"
          echo "$h" | grep -q '"ok":true' || { echo "::error::Service health check failed"; ok=0; }

          echo "2) Browser access allowed from the app's site (CORS):"
          c=$(curl -sS -m 20 -o /dev/null -D - -X OPTIONS -H "Origin: https://hayesbatson.github.io" -H "Access-Control-Request-Method: POST" "$API/r/1.abcdefghijklmnopqrstuvwx" | tr -d '\r' | grep -i '^access-control-allow-origin' || true)
          echo "   $c"
          echo "$c" | grep -q 'https://hayesbatson.github.io' || { echo "::error::CORS header missing"; ok=0; }

          echo "3) Service can sign in to Microsoft and read the MTA Requests list:"
          code=$(curl -sS -m 30 -o body.txt -w '%{http_code}' -H "Origin: https://hayesbatson.github.io" "$API/r/999999999.abcdefghijklmnopqrstuvwx")
          echo "   HTTP $code: $(cat body.txt)"
          if [ "$code" = "404" ] && grep -q "isn't valid" body.txt; then echo "   SharePoint access works."
          else echo "::error::The service couldn't read SharePoint (expected before the in-app Allow step, or the MTA Requests list doesn't exist yet)"; ok=0; fi

          [ "$ok" = 1 ] && echo "ALL CHECKS PASSED" || exit 1
