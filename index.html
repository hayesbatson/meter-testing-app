<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Meter Testing App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky shop header with tabs; working views below. Meter entry = form column + sticky result panel. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --surface-2:#f6f8f9; --ink:#14232e; --muted:#566874; --line:#d3dce1;
  --accent:#8a5d12; --on-accent:#ffffff; --accent-soft:#f5ead3; --focus:#1f6f94;
  --pass:#1b7342; --pass-bg:#e1f2e8; --fail:#b3261e; --fail-bg:#fbe5e2; --warn:#7e5300; --warn-bg:#fcefd0; --info:#1f5f7a; --info-bg:#e1eef4;
  --paper:#ffffff; --paper-ink:#111111; --paper-line:#999999;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e161c; --surface:#16222b; --surface-2:#1b2933; --ink:#e3eaee; --muted:#93a5b1; --line:#2b3c48;
  --accent:#d9a54a; --on-accent:#1a1205; --accent-soft:#33280f; --focus:#6cc0e6;
  --pass:#63cf92; --pass-bg:#123220; --fail:#ff8d84; --fail-bg:#3b1714; --warn:#f0c25a; --warn-bg:#3a2c0c; --info:#7cc4e4; --info-bg:#11303d;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161c; --surface:#16222b; --surface-2:#1b2933; --ink:#e3eaee; --muted:#93a5b1; --line:#2b3c48;
  --accent:#d9a54a; --on-accent:#1a1205; --accent-soft:#33280f; --focus:#6cc0e6;
  --pass:#63cf92; --pass-bg:#123220; --fail:#ff8d84; --fail-bg:#3b1714; --warn:#f0c25a; --warn-bg:#3a2c0c; --info:#7cc4e4; --info-bg:#11303d;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.proto{background:var(--accent-soft);color:var(--ink);font-size:13px}
.proto .wrap{padding-block:7px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.01em;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{padding:7px 12px;border-radius:6px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
nav.tabs a:hover{color:var(--ink);background:var(--surface-2)}
nav.tabs a.on{color:var(--ink);background:var(--accent-soft)}
nav.tabs .count{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:12px;text-align:center}
.mode{margin-left:auto;font-size:12px;color:var(--muted)}
main{padding-block:22px 60px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0}
h1{font-size:28px;line-height:1.1}
h2{font-size:19px}
h3{font-size:13px;font-family:var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
.crumb a{color:var(--muted)}
a{color:var(--info)}
.btn{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:7px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--fail)}
.btn.armed{background:var(--fail);border-color:var(--fail);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel>.hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.panel>.bd{padding:16px 18px}
.tablewrap{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
table.list td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:var(--surface-2)}
table.list td.num,table.list th.num{text-align:right}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.chip.pass{background:var(--pass-bg);color:var(--pass)}
.chip.fail{background:var(--fail-bg);color:var(--fail)}
.chip.none{background:var(--surface-2);color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.st.in_progress::before{background:var(--muted)}
.st.ready::before{background:var(--info)}
.st.question::before{background:var(--warn)}
.st.approved::before{background:var(--pass)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;min-width:0}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--focus);outline:1px solid var(--focus)}
input[readonly]{background:var(--surface-2);color:var(--muted)}
input.num{text-align:right}
textarea{resize:vertical;min-height:64px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.meterlayout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:980px){.meterlayout{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:980px){.side{position:static}}
.result-big{display:flex;align-items:center;justify-content:space-between;padding:14px;border-radius:8px;background:var(--surface-2)}
.result-big .lbl{font-family:var(--f-display);font-size:24px;font-weight:700}
.result-big.pass{background:var(--pass-bg);color:var(--pass)}
.result-big.fail{background:var(--fail-bg);color:var(--fail)}
.tests{width:100%;border-collapse:collapse;font-size:14px}
.tests th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:4px 6px}
.tests td{padding:5px 6px;vertical-align:middle}
.tests td.rate{white-space:nowrap}
.tests td.rate b{display:block;font-size:14px}
.tests td.rate span{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.tests input{min-width:84px}
.tests .res{width:76px;text-align:center}
.sec{border-top:1px solid var(--line);padding-top:16px;margin-top:4px}
.note{font-size:13px;color:var(--muted)}
.callout{padding:10px 12px;border-radius:8px;font-size:14px}
.callout.warn{background:var(--warn-bg);color:var(--ink)}
.callout.info{background:var(--info-bg);color:var(--ink)}
.savestate{font-size:12px;color:var(--muted)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.photos figure{margin:0;position:relative}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
.photos button{position:absolute;top:4px;right:4px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.qbox{border-left:3px solid var(--warn);padding:8px 12px;background:var(--warn-bg);border-radius:0 6px 6px 0;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
/* report paper: always white, like the printed page */
.paperwrap{overflow-x:auto;padding:8px 0}
.paper{background:var(--paper);color:var(--paper-ink);width:8.5in;min-height:11in;margin:0 auto;padding:.6in .7in;box-shadow:0 2px 14px rgba(0,0,0,.18);font-family:Helvetica,Arial,sans-serif;font-size:12.5px;line-height:1.35}
.paper .rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.paper .logo{width:3.5in;max-width:60%;height:auto;margin-left:-6px}.paper .addr{text-align:right}
.paper .addr{font-size:11.5px}
.paper .ttl{text-align:center;font-weight:700;font-size:22px;margin:22px 0 12px}
.paper .sh{font-weight:700;font-size:13.5px;border-bottom:1px solid var(--paper-line);margin:16px 0 6px;padding-bottom:2px}
.paper table{border-collapse:collapse;font-size:inherit}
.paper td,.paper th{padding:2px 10px 2px 0;text-align:left;vertical-align:top}
.paper th{font-weight:700}
.paper .r{text-align:right}
.paper .kv td:first-child{color:#444;width:110px}
.paper .stmt{margin-top:12px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<style>
.pts{border-collapse:collapse;font-size:14px}
.pts th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:4px 6px}
.pts td{padding:4px 6px}
.pts input{min-width:70px}
.pts td.n{color:var(--muted);font-family:var(--f-mono);width:24px}
.wo{font-family:var(--f-mono);font-weight:500;background:var(--accent-soft);padding:1px 7px;border-radius:5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:var(--surface);color:var(--muted);padding:8px 14px;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--ink)}
.accs{font-family:var(--f-mono);font-size:13px}
.paper .foot{margin-top:28px;padding-top:6px;border-top:1px solid var(--paper-line);font-size:11px;font-style:italic}
</style>
<style>html,body{margin:0}body{font-size:15px;-webkit-text-size-adjust:100%}[hidden]{display:none!important}img{max-width:100%}</style>
</head>

/* ---------- accuracy logic ---------- */
function points(m){
  if(m.custom)return (m.points||[]).map((p,i)=>{const lo=num(p.low),hi=num(p.high);return{label:p.name||`Test ${i+1}`,lim:lo!==null&&hi!==null?[lo,hi]:null}});
  return STD.map(r=>({label:r.label,lim:((m.limitsUsed||{})[r.k])||(S.limits[m.type]||{})[r.k]||null}));
}
function testPct(t,calc){
  if(!t)return null;
  if(calc){const a=num(t.start),b=num(t.end),v=num(t.vol);if(a===null||b===null||!v)return null;return (b-a)/v*100}
  return num(t.pct);
}
function evalTests(m,which){
  const arr=m[which]||[];
  return points(m).map((pt,i)=>{
    const t=arr[i]||{};const pct=testPct(t,!m.pctDirect);let pass=null;
    if(pct!==null&&pt.lim){const p=Math.round(pct*100)/100;pass=p>=pt.lim[0]-1e-9&&p<=pt.lim[1]+1e-9}
    return {label:pt.label,gpm:num(t.gpm),pct,lim:pt.lim,pass};
  });
}
function meterResult(m){
  const before=evalTests(m,"before");
  const after=m.calibrated?evalTests(m,"after"):null;
  const final=after||before;
  let overall="incomplete";
  if(!final.length||(!m.custom&&!m.type))overall="incomplete";
  else if(final.some(t=>t.pass===false))overall="fail";
  else if(final.every(t=>t.pass===true))overall="pass";
  return {before,after,final,overall,usedAfter:!!after};
}

function route(){

  for(const p of ["job","meter","report","hist"]) if(h.startsWith(p+"-"))return{v:p,id:h.slice(p.length+1)};
  if(h.startsWith("order-"))return{v:"job",id:h.slice(6)};
  if(h==="review"||h==="setup"||h==="perf")return{v:h};
  return{v:"jobs"};
}

    .map(([h,t])=>`<a href="#${h}" class="${(r.v===h||(h==="jobs"&&["job","meter","report","hist"].includes(r.v)))?"on":""}">${t}</a>`).join("");

  else if(r.v==="review")app.innerHTML=viewReview();
  else if(r.v==="setup")app.innerHTML=viewSetup();
  else if(r.v==="perf")app.innerHTML=viewPerf();
  tick();
  if(fid){const el=document.getElementById(fid);if(el&&el!==document.activeElement){el.focus();try{if(selS!=null)el.setSelectionRange(selS,selE)}catch(e){}}}
}

function metersOf(oid){return [...S.meters.values()].filter(m=>m.orderId===oid).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))}
function nextWo(){let mx=Math.max(num(S.settings.woFloor)||0,HIST.woMax||0);S.meters.forEach(m=>{const n=num(m.wo);if(n!==null&&n>mx&&n<1e9)mx=n});return mx?String(mx+1):""}

function statusButtons(m){
  const b=(s,t,cls="")=>`<button class="btn small ${cls}" data-act="status" data-s="${s}">${t}</button>`;
  if(m.status==="approved")return b("in_progress","Reopen for edits");
  return (m.status!=="ready"?b("ready","Ready for review"):"")+b("question","Send question")+b("approved","Approve","primary");
}
function normalize(m){
  m.reads=m.reads||{};m.photos=m.photos||[];m.status=m.status||"in_progress";
  if(m.custom&&!Array.isArray(m.points))m.points=[];
  const n=points(m).length;
  ["before","after"].forEach(w=>{m[w]=Array.isArray(m[w])?m[w]:[];while(m[w].length<n)m[w].push(blankTest())});
  return m;
}
function updateLive(){
  if(!editing)return;const m=editing.draft;const r=meterResult(m);
  ["before","after"].forEach(w=>evalTests(m,w).forEach((t,i)=>{
    const c=document.querySelector(`[data-res="${w}-${i}"]`);if(c)c.innerHTML=t.pass===null?'<span class="chip none">—</span>':chip(t.pass?"pass":"fail");
    const calc=document.querySelector(`[data-calc="${w}-${i}"]`);if(calc)calc.value=t.pct===null?"":f2(t.pct);
    const l=document.getElementById(`lbl-${w}-${i}`);if(l)l.textContent=t.label;const g=document.getElementById(`rng-${w}-${i}`);if(g)g.textContent=rangeTxt(t.lim);
  }));
  const big=$("#bigres");if(big){big.className="result-big "+(r.overall==="pass"?"pass":r.overall==="fail"?"fail":"");
    big.innerHTML=`<div><div class="note" style="color:inherit">${r.usedAfter?"Result after calibration":"Result"}</div><div class="lbl">${r.overall==="pass"?"Meets AWWA":r.overall==="fail"?"Does not meet AWWA":"Incomplete"}</div></div>`}
  const hs=$("#h-serial");if(hs)hs.textContent=m.serial||"no serial";const hw=$("#h-wo");if(hw)hw.textContent=m.wo||"—";
}
function chainReads(path){
  const m=editing.draft;const [w,i,k]=path.split(".");const n=+i;const arr=m[w];const last=points(m).length-1;

}

/* ---------- performance ---------- */
let perfFrom="",perfTo="";
const parseDay=s=>{if(!s)return null;const [y,m,d]=s.split("-").map(Number);return y&&m&&d?new Date(y,m-1,d).getTime():null};
const median=a=>{if(!a.length)return null;const b=[...a].sort((x,y)=>x-y);const h=b.length>>1;return b.length%2?b[h]:(b[h-1]+b[h])/2};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const f1=v=>v===null?"—":v.toFixed(1);
function viewPerf(){
  if(!perfTo){perfTo=today();const d=new Date();d.setDate(d.getDate()-30);perfFrom=dayKey(d.getTime())}
  const from=parseDay(perfFrom),to=parseDay(perfTo)+864e5-1;
  const inR=ms=>ms!==null&&ms>=from&&ms<=to;
  const all=[...S.meters.values()].map(m=>normalize(clone(m)));
  const nMeters={};all.forEach(m=>{nMeters[m.orderId]=(nMeters[m.orderId]||0)+1});
  const tested=all.filter(m=>inR(parseDay(m.testDate)));
  const decided=tested.map(m=>meterResult(m).overall).filter(r=>r!=="incomplete");
  const passN=decided.filter(r=>r==="pass").length;
  const out=all.filter(m=>m.dateIn&&m.dateOut&&inR(parseDay(m.dateOut)));
  const tat=out.map(m=>(parseDay(m.dateOut)-parseDay(m.dateIn))/864e5).filter(d=>d>=0);
  const entries=[];S.orders.forEach(o=>jobTime(o).forEach(t=>{if(t.end&&inR(t.start))entries.push({o,t,min:(t.end-t.start)/60000})}));
  const totalMin=entries.reduce((a,e)=>a+e.min,0);
  const jobMin={};entries.forEach(e=>{jobMin[e.o.id]=(jobMin[e.o.id]||0)+e.min});
  const jobsWithTime=Object.keys(jobMin).filter(id=>nMeters[id]);
  const metersTimed=jobsWithTime.reduce((a,id)=>a+nMeters[id],0);
  const minPerMeter=metersTimed?jobsWithTime.reduce((a,id)=>a+jobMin[id],0)/metersTimed:null;
  const jobsDone=[...S.orders.values()].map(o=>{const ms=all.filter(m=>m.orderId===o.id);if(!ms.length||ms.some(m=>!m.dateOut))return null;
    const last=Math.max(...ms.map(m=>parseDay(m.dateOut)));const startD=parseDay(o.received)??Math.min(...ms.map(m=>parseDay(m.dateIn)??Infinity));
    return inR(last)&&isFinite(startD)?(last-startD)/864e5:null}).filter(v=>v!==null&&v>=0);
  const open=all.filter(m=>m.dateIn&&!m.dateOut).map(m=>({m,days:Math.floor((Date.now()-parseDay(m.dateIn))/864e5)})).sort((a,b)=>b.days-a.days);
  const techs=[...new Set([...tested.map(m=>m.tech),...entries.map(e=>e.t.tech)].filter(Boolean))].sort();
  const techRows=techs.map(t=>{
    const tm=tested.filter(m=>m.tech===t);const res=tm.map(m=>meterResult(m).overall);const p=res.filter(r=>r==="pass").length,f=res.filter(r=>r==="fail").length;
    const te=entries.filter(e=>e.t.tech===t);const mins=te.reduce((a,e)=>a+e.min,0);
    const jobs=[...new Set(te.map(e=>e.o.id))].filter(id=>nMeters[id]);const jm=jobs.reduce((a,id)=>a+nMeters[id],0);
    const tmin=te.filter(e=>nMeters[e.o.id]).reduce((a,e)=>a+e.min,0);
    const tt=out.filter(m=>m.tech===t).map(m=>(parseDay(m.dateOut)-parseDay(m.dateIn))/864e5).filter(d=>d>=0);
    const q=tm.filter(m=>String(m.question||"").trim()).length;
    return `<tr><td><b>${esc(t)}</b></td><td class="num">${tm.length}</td><td class="num">${p}</td><td class="num">${f?`<span style="color:var(--fail);font-weight:700">${f}</span>`:0}</td><td class="num">${p+f?Math.round(p/(p+f)*100)+"%":"—"}</td>
      <td class="num mono">${(mins/60).toFixed(1)}</td><td class="num">${jobs.length}</td><td class="num mono">${jm?Math.round(tmin/jm):"—"}</td><td class="num mono">${f1(avg(tt))}</td><td class="num">${q}</td></tr>`}).join("");
  const tile=(label,val,sub)=>`<div class="panel"><div class="bd"><div class="note">${label}</div><div style="font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.1" class="num">${val}</div>${sub?`<div class="note">${sub}</div>`:""}</div></div>`;
  const run=runningTimers();
  return `<div class="stack">
    <div class="row spread"><h1>Shop performance</h1>
      <div class="row"><label class="f">From<input type="date" id="pf-from" value="${perfFrom}"></label><label class="f">To<input type="date" id="pf-to" value="${perfTo}"></label>
      <button class="btn" data-act="time-csv" style="align-self:flex-end">Time log CSV</button></div></div>
    <p class="muted" style="margin:0;max-width:75ch">Internal only. Turnaround is calendar days from date in to date out. Time is logged per job, so minutes per meter is a job's logged time divided by the meters on it.</p>
    <div class="grid g4">
      ${tile("Meters tested",tested.length,`${decided.length?Math.round(passN/decided.length*100)+"% passed":"no results yet"}`)}
      ${tile("Avg turnaround per meter",tat.length?f1(avg(tat))+" d":"—",tat.length?`median ${f1(median(tat))} d · ${tat.length} meter${tat.length===1?"":"s"} out`:"needs date in and date out")}
      ${tile("Avg turnaround per job",jobsDone.length?f1(avg(jobsDone))+" d":"—",jobsDone.length?`${jobsDone.length} jobs finished`:"no finished jobs")}
      ${tile("Hands-on time",(totalMin/60).toFixed(1)+" h",minPerMeter!==null?`avg ${Math.round(minPerMeter)} min per meter`:"no time logged")}
    </div>
    <div class="panel"><div class="hd"><h2>By technician</h2><span class="note">Meters counted by test date. Min per meter = the tech's time on a job ÷ meters on that job.</span></div><div class="tablewrap"><table class="list"><thead><tr><th>Technician</th><th class="num">Meters tested</th><th class="num">Pass</th><th class="num">Fail</th><th class="num">Pass rate</th><th class="num">Hours logged</th><th class="num">Jobs worked</th><th class="num">Min / meter</th><th class="num">Avg turnaround (d)</th><th class="num">Questions sent</th></tr></thead>
      <tbody>${techRows||'<tr><td colspan="10"><div class="empty">No meters tested or time logged in this date range.</div></td></tr>'}</tbody></table></div></div>
    ${run.length?`<div class="panel"><div class="hd"><h2>Timers running now</h2></div><div class="tablewrap"><table class="list"><tbody>${run.map(({o,t})=>`<tr class="click" data-go="job-${o.id}"><td><b>${esc(t.tech)}</b></td><td>${esc(o.client)} · ${esc(jobName(o))}</td><td>${esc(t.activity)}</td><td class="mono" data-since="${t.start}">${fmtClock(Date.now()-t.start)}</td><td data-stop><button class="btn small" data-act="time-stop" data-oid="${o.id}" data-t="${t.id}">Stop</button></td></tr>`).join("")}</tbody></table></div></div>`:""}
    <div class="panel"><div class="hd"><h2>In the shop now</h2><span class="note">Meters with a date in and no date out, oldest first</span></div><div class="tablewrap"><table class="list"><thead><tr><th>WO</th><th>Serial</th><th>Client</th><th>Tech</th><th class="num">Days in shop</th><th>Status</th></tr></thead><tbody>
      ${open.slice(0,25).map(({m,days})=>{const o=S.orders.get(m.orderId)||{};return `<tr class="click" data-go="meter-${m.id}"><td><span class="wo">${esc(m.wo)||"—"}</span></td><td class="mono">${esc(m.serial)}</td><td>${esc(o.client)}</td><td>${esc(m.tech)}</td><td class="num"><b style="color:${days>14?"var(--fail)":days>7?"var(--warn)":"inherit"}">${days}</b></td><td><span class="st ${m.status}">${STATUS[m.status]}</span></td></tr>`}).join("")||'<tr><td colspan="6"><div class="empty">No meters waiting.</div></td></tr>'}
    </tbody></table></div></div>
  </div>`;
}

    if(window.msal&&e instanceof msal.InteractionRequiredAuthError){await msalApp.acquireTokenRedirect({scopes,account});await sleep(30000)}
    throw e;

async function gfetch(path,opt={}){
  const url=path.startsWith("https://")?path:"https://graph.microsoft.com/v1.0"+path;
  for(let attempt=0;attempt<6;attempt++){
    const headers={Authorization:"Bearer "+await getToken(opt.scopes),...(opt.headers||{})};
    let body=opt.body;if(opt.json!==undefined){headers["Content-Type"]="application/json";body=JSON.stringify(opt.json)}
    let r;
    try{r=await fetch(url,{method:opt.method||"GET",headers,body})}
    catch(e){if(attempt<2){await sleep(1500);continue}throw new Error("Can't reach Microsoft. Check the internet connection and try again.")}
    if(r.status===429||r.status===503||r.status===504){await sleep((num(r.headers.get("Retry-After"))||2**attempt)*1000);continue}
    if(!r.ok){let msg=`${r.status} ${r.statusText}`;try{const j=await r.json();if(j.error&&j.error.message)msg=j.error.message}catch(e){}
      const err=new Error(msg);err.status=r.status;throw err}
    if(r.status===204)return null;
    const ct=r.headers.get("content-type")||"";return ct.includes("json")?r.json():r.blob();
  }
  throw new Error("Microsoft is busy right now. Try again in a minute.");
}

}

      const l=await step(`Creating the list "${CFG.lists[k]}"`,()=>gfetch(`/sites/${siteId}/lists`,{method:"POST",scopes:MANAGE_SCOPES,json:{displayName:CFG.lists[k],columns,list:{template:"genericList"}}}));listIds[k]=l.id}

  async remove(coll,id){await gfetch(`${listItems(coll)}/${id}`,{method:"DELETE"})},
  async putFile(path,blob){return gfetch(`/sites/${siteId}/drive/root:/${encPath(CFG.folder+"/"+path)}:/content`,{method:"PUT",body:blob,headers:{"Content-Type":blob.type||"application/octet-stream"}})},

  if(HIST.state==="loading"||HIST.state==="idle")return '<div class="note">Searching the old system…</div>';
  if(HIST.state!=="ready")return "";
  const hits=histSearch(q);
  return `<div class="panel"><div class="hd"><h2>Old system matches</h2><span class="note">Read only · ${hits.length>=100?"first 100 shown":hits.length+" found"}</span></div><div class="tablewrap"><table class="list"><thead><tr><th>WO</th><th>Serial</th><th>Customer</th><th>Type</th><th>Size</th><th>Date in</th><th>Date out</th></tr></thead><tbody>
    ${hits.map(r=>`<tr class="click" data-go="hist-${esc(r[0])}"><td><span class="wo">${esc(r[0])}</span></td><td class="mono">${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(tl(r[5]))}</td><td>${esc(r[6])}</td><td>${fmtDate(r[3])}</td><td>${fmtDate(r[4])}</td></tr>`).join("")||'<tr><td colspan="7"><div class="empty">No old work orders match.</div></td></tr>'}
    </tbody></table></div></div>`;
}
render();start();
</script>
</body>
</html>
