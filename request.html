<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Send meters for testing · Mid America Meter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#eef2f4;--surface:#fff;--surface-2:#f6f8f9;--ink:#14232e;--muted:#566874;--line:#d3dce1;--accent:#8a5d12;--on-accent:#fff;--accent-soft:#f5ead3;--focus:#1f6f94;
  --fail:#b3261e;--fail-bg:#fbe5e2;--pass:#1b7342;--pass-bg:#e1f2e8;--info:#1f5f7a;--info-bg:#e1eef4;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;--f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
.wrap{max-width:860px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) 60px}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;justify-content:space-between;padding-block:14px;flex-wrap:wrap}
header.top img{height:46px;width:auto}
header.top .co{font-size:13px;color:var(--muted);text-align:right}
h1{font-family:var(--f-display);font-size:32px;line-height:1.1;margin:22px 0 6px;text-wrap:balance}
h2{font-family:var(--f-display);font-size:22px;margin:0}
p{margin:0 0 10px}
.lead{color:var(--muted);max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
label.f .opt{font-weight:400}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid #b9c6cd;border-radius:7px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--focus)}
.req::after{content:" *";color:var(--fail)}
.btn{font:inherit;font-weight:600;font-size:15px;border:1px solid #b9c6cd;background:#fff;color:var(--ink);border-radius:8px;padding:9px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{font-size:13px;padding:6px 10px}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.meter{border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px;background:var(--surface-2)}
.meter h3{margin:0;font-size:16px}
.radio{display:flex;gap:16px;flex-wrap:wrap;font-weight:500;color:var(--ink);font-size:15px}
.radio label{display:flex;gap:6px;align-items:center}
.radio input,.check input{width:auto}
.check{display:flex;gap:8px;align-items:flex-start;font-size:15px}
.note{font-size:13px;color:var(--muted)}
.msg{border-radius:8px;padding:12px 14px;margin-top:14px}
.msg.err{background:var(--fail-bg);color:var(--fail)}
.msg.ok{background:var(--pass-bg);color:var(--pass)}
.msg.info{background:var(--info-bg);color:var(--info)}
.addr{font-weight:600;line-height:1.45}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.slip{background:#fff;border:1px dashed #9aa9b1;border-radius:8px;padding:18px;margin-top:12px}
.slip .big{font-family:var(--f-display);font-size:26px}
.err-field{border-color:var(--fail)!important}
.sticky{position:sticky;bottom:0;background:var(--bg);padding:12px 0;border-top:1px solid var(--line);margin-top:20px}
@media print{header.top,.noprint{display:none!important}body{background:#fff}.wrap{padding:0}.slip{border:0}}
</style>
</head>

}
const fld=(path,label,{req,type="text",ph="",opt,auto}={})=>`<label class="f"><span class="${req?"req":""}">${label}${opt?' <span class="opt">(optional)</span>':""}</span><input id="${path.replace(/\./g,"-")}" data-p="${path}" type="${type}" value="${esc(get(path))}" placeholder="${esc(ph)}" ${auto?`autocomplete="${auto}"`:""} ${req?"required":""}></label>`;
function get(path){return path.split(".").reduce((o,k)=>o==null?"":o[k],form)}
function set(path,v){const ks=path.split(".");let o=form;ks.slice(0,-1).forEach(k=>o=o[k]);o[ks[ks.length-1]]=v}
function addrBlock(key,title,note){return `<div><h3 style="margin:0 0 8px;font-size:16px">${title}</h3>${note?`<p class="note">${note}</p>`:""}<div class="grid">
  ${fld(key+".company","Company",{req:key==="shipTo"})}${fld(key+".attn","Attention",{opt:true})}${fld(key+".street1","Street address",{req:key==="shipTo",auto:"address-line1"})}${fld(key+".street2","Address line 2",{opt:true,auto:"address-line2"})}
  ${fld(key+".city","City",{req:key==="shipTo"})}${fld(key+".state","State",{req:key==="shipTo"})}${fld(key+".zip","ZIP",{req:key==="shipTo",auto:"postal-code"})}</div></div>`}
function meterBlock(m,i){
  return `<div class="meter" id="meter-${i}"><div class="row spread"><h3>Meter ${form.meters.length>1?`line ${i+1}`:""}</h3><div class="row">
      <button type="button" class="btn small" data-act="copy" data-i="${i}">Copy this meter</button>${form.meters.length>1?`<button type="button" class="btn small" data-act="rm" data-i="${i}">Remove</button>`:""}</div></div>
    <div class="grid" style="margin-top:10px">
      <label class="f"><span class="req">How many meters like this?</span><input id="m-${i}-qty" data-p="meters.${i}.qty" type="number" min="1" max="2000" inputmode="numeric" value="${esc(m.qty)}"></label>
      <label class="f"><span class="req">Size</span><input id="m-${i}-size" data-p="meters.${i}.size" list="sizes" value="${esc(m.size)}" placeholder='e.g. 5/8 x 3/4"'></label>
      <label class="f">Type<select id="m-${i}-type" data-p="meters.${i}.type">${["",...TYPES].map(t=>`<option value="${esc(t)}" ${m.type===t?"selected":""}>${t||"Choose…"}</option>`).join("")}</select></label>
      <label class="f">Brand<input id="m-${i}-brand" data-p="meters.${i}.brand" value="${esc(m.brand)}" placeholder="e.g. Neptune"></label>
      <label class="f">Model <span class="opt">(optional)</span><input id="m-${i}-model" data-p="meters.${i}.model" value="${esc(m.model)}"></label>
      <label class="f">Meter operates at (GPM) <span class="opt">(optional)</span><input id="m-${i}-gpm" data-p="meters.${i}.gpm" inputmode="decimal" value="${esc(m.gpm)}"></label>
      <label class="f">Meter location <span class="opt">(optional)</span><input id="m-${i}-location" data-p="meters.${i}.location" value="${esc(m.location)}" placeholder="e.g. Well house 2"></label>
    </div>
    <div style="margin-top:12px"><span class="note" style="font-weight:600">Service wanted</span><div class="radio" role="radiogroup" aria-label="Service wanted">
      <label><input type="radio" name="svc-${i}" data-p="meters.${i}.service" value="test" ${m.service!=="clean"?"checked":""}>Test only</label>
      <label><input type="radio" name="svc-${i}" data-p="meters.${i}.service" value="clean" ${m.service==="clean"?"checked":""}>Clean, test &amp; repair</label></div></div>
    <div class="grid" style="margin-top:12px">
      <label class="f">Serial numbers <span class="opt">(optional, one per line)</span><textarea id="m-${i}-serials" data-p="meters.${i}.serials" rows="3">${esc(m.serials)}</textarea></label>
      <label class="f">Notes about ${m.qty>1?"these meters":"this meter"} <span class="opt">(optional)</span><textarea id="m-${i}-notes" data-p="meters.${i}.notes" rows="3">${esc(m.notes)}</textarea></label></div>
  </div>`}
function total(){return form.meters.reduce((a,m)=>a+(Math.max(1,parseInt(m.qty)||1)),0)}
function render(){
  const app=$("#app");
  if(mode==="error"){app.innerHTML=`<h1>Send meters for testing</h1><div class="msg err">${esc(err)}</div>`;return}
  if(mode==="loading")return;
  if(mode==="done")return renderDone();
  const pre=view.prefill;
  app.innerHTML=`<h1>Send meters for testing</h1>
    <p class="lead">Fill in your details once, then add each kind of meter you're sending. Identical meters go on one line with a quantity. It takes a few minutes, and you can come back to this link to make changes until we receive your meters.</p>
    ${pre.message?`<div class="msg info">${esc(pre.message)}</div>`:""}
    ${view.submittedAt?`<div class="msg info">You sent this request on ${new Date(view.submittedAt).toLocaleDateString()}. Changes you send now replace it.</div>`:""}
    <form id="f" novalidate>
    <div class="panel"><h2>Your details</h2><div class="grid" style="margin-top:12px">
      ${fld("company","Company or utility",{req:true,auto:"organization"})}${fld("contact","Contact name",{req:true,auto:"name"})}${fld("phone","Phone",{req:true,type:"tel",auto:"tel"})}${fld("email","Email for test results",{req:true,type:"email",auto:"email"})}${fld("po","Your PO #",{opt:true})}</div>
      <label class="check" style="margin-top:14px"><input type="checkbox" id="callFirst" data-p="callFirst" ${form.callFirst?"checked":""}><span>Call or email me with an estimate before any work is done</span></label>
      <label class="f" style="margin-top:12px">Special instructions <span class="opt">(optional)</span><textarea id="instructions" data-p="instructions" rows="3">${esc(form.instructions)}</textarea></label></div>
    <div class="panel stack"><h2>Addresses</h2><div style="margin-top:12px">${addrBlock("shipTo","Return the meters to","Where we ship your meters after testing.")}</div>
      <div style="margin-top:18px">${addrBlock("billTo","Bill to",'Leave blank if it\'s the same as the return address.')}</div></div>
    <div class="panel"><div class="row spread"><h2>Meters</h2><span class="note" id="tot">${total()} meter${total()===1?"":"s"} in all</span></div>
      ${form.meters.map(meterBlock).join("")}
      <div class="row" style="margin-top:12px"><button type="button" class="btn" data-act="add">Add a different meter</button></div></div>
    <datalist id="sizes">${SIZES.map(s=>`<option value="${esc(s)}">`).join("")}</datalist>
    <div id="msg"></div>
    <div class="sticky noprint"><div class="row spread"><span class="note">Fields marked <span style="color:var(--fail)">*</span> are required.</span><button type="submit" class="btn primary" id="send">Send request</button></div></div>
    </form>`;
}
function renderDone(){
  const s=form,ref=view.ref;const when=view.submittedAt?new Date(view.submittedAt):null;
  const rows=s.meters.map(m=>`<tr><td>${esc(m.qty)}</td><td>${esc(m.size)}</td><td>${esc(m.type)}</td><td>${esc([m.brand,m.model].filter(Boolean).join(" "))}</td><td>${m.service==="clean"?"Clean, test &amp; repair":"Test only"}</td><td style="white-space:pre-wrap">${esc(m.serials)}</td></tr>`).join("");
  $("#app").innerHTML=`<h1>${view.status==="received"?"We have your meters":"Thank you, your request is in"}</h1>
    ${view.status==="received"?`<div class="msg info">Mid America Meter has received this request. For changes, call ${MAM.phone}.</div>`:view.expired?`<div class="msg info">This link has expired. Call ${MAM.phone} if anything changed.</div>`:`<p class="lead">Print the packing slip below and put it in the box with your meters. You can come back to this link to make changes until we receive them.</p>`}
    <div class="panel noprint"><h2>Ship your meters to</h2><p class="addr" style="margin-top:8px">${MAM.name}<br>${MAM.street}<br>${MAM.city}</p><p class="note">Questions? Call ${MAM.phone}.</p>
      <div class="row"><button class="btn primary" data-act="print">Print packing slip</button>${view.status!=="received"&&!view.expired?`<button class="btn" data-act="edit">Make changes</button>`:""}</div></div>
    <div class="slip"><div class="row spread"><div><div class="note">Packing slip · put this in the box</div><div class="big">Request ${esc(ref)}</div></div><div style="text-align:right" class="note">${when?when.toLocaleDateString():""}</div></div>
      <div class="grid" style="margin-top:12px"><div><div class="note">From</div><div class="addr">${esc(s.company)}<br>${esc(s.contact)} · ${esc(s.phone)}<br>${esc(s.email)}${s.po?`<br>PO # ${esc(s.po)}`:""}</div></div>
        <div><div class="note">Ship to</div><div class="addr">${MAM.name}<br>${MAM.street}<br>${MAM.city}</div></div></div>
      <table style="margin-top:14px"><thead><tr><th>Qty</th><th>Size</th><th>Type</th><th>Brand / model</th><th>Service</th><th>Serials</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="note" style="margin-top:10px">${total()} meter${total()===1?"":"s"} in all.${s.callFirst?" Please call or email with an estimate before any work.":""}</p></div>`;
}
document.addEventListener("input",e=>{const t=e.target;if(!t.dataset||!t.dataset.p)return;t.classList.remove("err-field");
  set(t.dataset.p,t.type==="checkbox"?t.checked:t.value);if(/\.qty$/.test(t.dataset.p)){const el=$("#tot");if(el)el.textContent=`${total()} meter${total()===1?"":"s"} in all`}});
document.addEventListener("change",e=>{const t=e.target;if(t.type==="radio"&&t.dataset.p)set(t.dataset.p,t.value)});
document.addEventListener("click",e=>{const a=e.target.closest("[data-act]");if(!a)return;const i=+a.dataset.i;
  if(a.dataset.act==="add"){form.meters.push(blankMeter());render();const f=document.getElementById(`m-${form.meters.length-1}-qty`);if(f){f.focus();f.select()}}
  else if(a.dataset.act==="copy"){const c=JSON.parse(JSON.stringify(form.meters[i]));c.serials="";form.meters.splice(i+1,0,c);render();const f=document.getElementById(`m-${i+1}-qty`);if(f){f.focus();f.select()}}
  else if(a.dataset.act==="rm"){form.meters.splice(i,1);render()}
  else if(a.dataset.act==="print"){window.print()}
  else if(a.dataset.act==="edit"){mode="form";render();window.scrollTo(0,0)}
});
document.addEventListener("submit",async e=>{e.preventDefault();
  const req=[...document.querySelectorAll("[required]")].filter(x=>!String(x.value).trim());
  form.meters.forEach((m,i)=>{if(!String(m.size).trim())req.push(document.getElementById(`m-${i}-size`))});
  const em=$("#email");if(em&&em.value&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em.value))req.push(em);
  req.forEach(x=>x&&x.classList.add("err-field"));
  const msg=$("#msg");
  if(req.length){msg.innerHTML=`<div class="msg err">Please fill in the ${req.length===1?"highlighted field":req.length+" highlighted fields"}.</div>`;req[0].focus();return}
  const b=$("#send");b.disabled=true;b.textContent="Sending…";
  try{const r=await fetch(`https://${API}/r/${REF}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(form)});const j=await r.json();
    if(!r.ok)throw new Error(j.error||"The request couldn't be sent.");
    view=j.view;form=JSON.parse(JSON.stringify(view.submission));mode="done";render();window.scrollTo(0,0);
  }catch(x){msg.innerHTML=`<div class="msg err">${esc(x.message||"The request couldn't be sent. Check your connection and try again.")}</div>`;b.disabled=false;b.textContent="Send request"}
});
load();
</script>
</body>
</html>
